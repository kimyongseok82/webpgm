<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>애니메이션</title>
    <style>
        p{
            animation: slide 3s linear forwards;
        }

        @keyframes slide{
            from{
                transform: translateX(100%);
            }
            to{
                transform: translateX(0);
                
            }
        }
    </style>
</head>
<body>
    <h2>애니메이션 응용</h2>
    <hr>
    <p>질문 있습니다.</p>
</body>
</html>
