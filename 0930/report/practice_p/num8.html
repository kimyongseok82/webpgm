<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>리스트로 수직 메뉴 만들기</title>
    <style>
        #menubar{
            background-color: olive;
            width: 150px;
        }

        ul{
            margin: 0;
            padding: 0;
        }

        ul li{
            list-style-type: none;
        }
        ul li:hover{
            color: violet;
        }
    </style>
</head>

<body>
    <nav id="menubar">
        <ul>
            <li>Home</li>
            <li>Espresso</li>
            <li>Cappuccino</li>
            <li>Cafe Latte</li>
            <li>F.A.Q</li>
        </ul>
    </nav>
</body>

</html>
