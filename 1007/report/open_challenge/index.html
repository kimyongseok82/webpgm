<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>별 문자 출력하기</title>
</head>
<body>
    <h2>별 문자 출력하기</h2>
    <hr>

    <script>
        let s = prompt("정수를 입력하세요");

        let n = parseInt(s);

        if(isNaN(n)){
            document.write("입력 오류 입니다.")
        }else{
            for(let i=1; i<=n; i++){
                document.write("*".repeat(i));
                document.write("<br>")
            }
        }
    </script>
</body>
</html>
