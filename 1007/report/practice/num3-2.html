<!DOCTYPE html>
<html lang="en">
<head>

    <title>document.write()</title>
</head>
<body>
    <script>
        document.write("<h2>document.write()로 표 만들기</h2>");
        document.write("<hr>");
        document.write("");
        
    </script>
    <table border="1">
        <tbody>
            <tr>
                <td>n</td>

                <td>5</td>
                <td>6</td>
                <td>7</td>
                <td>8</td>
                <td>9</td>
            </tr>

            <tr>
                <td>n^2</td>
                <td>0</td>
                <td>1</td>
                <td>4</td>
                <td>9</td>
                <td>16</td>
                <td>25</td>
                <td>36</td>
                <td>49</td>
                <td>64</td>
                <td>81</td>
            </tr>
        </tbody>
    </table>
</body>

</html>
