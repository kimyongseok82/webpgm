<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>큰 자리수와 낮은 자리수</title>
</head>
<body>
    <h2>큰 자리수와 낮은 자리수 같은지 비교</h2>
    <hr>
    <script>
        let s = prompt("숫자 입력");

        if(s[0]==s[s.length-1]){
            document.write(s+": 같음")
        }else{
            document.write(s+": 다름")
        }

    </script>
</body>
</html>
